<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="trophyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="45%" stop-color="#F5AD42"/>
      <stop offset="100%" stop-color="#A66308"/>
    </linearGradient>
    <linearGradient id="woodBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D4E2A"/>
      <stop offset="100%" stop-color="#4A2511"/>
    </linearGradient>
  </defs>
  <!-- Asas laterales -->
  <path d="M34 30 C12 30, 12 66, 38 68" fill="none" stroke="url(#trophyGold)" stroke-width="7" stroke-linecap="round"/>
  <path d="M94 30 C116 30, 116 66, 90 68" fill="none" stroke="url(#trophyGold)" stroke-width="7" stroke-linecap="round"/>
  <!-- Copa principal -->
  <path d="M30 20 L98 20 L88 66 C84 82, 44 82, 40 66 Z" fill="url(#trophyGold)" stroke="#5C3404" stroke-width="2.5"/>
  <!-- Cuello y pedestal -->
  <rect x="56" y="76" width="16" height="18" rx="4" fill="url(#trophyGold)" stroke="#5C3404" stroke-width="2"/>
  <rect x="36" y="92" width="56" height="10" rx="5" fill="url(#trophyGold)" stroke="#5C3404" stroke-width="2"/>
  <rect x="28" y="100" width="72" height="16" rx="4" fill="url(#woodBase)" stroke="#F5AD42" stroke-width="2"/>
  <!-- Emblema de Bola 8 en el centro de la copa -->
  <circle cx="64" cy="46" r="16" fill="#1C1C1C" stroke="#FFF59D" stroke-width="2"/>
  <circle cx="64" cy="46" r="8" fill="#FFFFFF"/>
  <text x="64" y="50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#111111" text-anchor="middle">8</text>
</svg>
